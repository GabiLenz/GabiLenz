<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300">
    <stop stop-color="#030008"/>
    <stop offset="0.45" stop-color="#1A0533"/>
    <stop offset="1" stop-color="#080014"/>
</linearGradient>


<radialGradient id="purpleGlow">
    <stop stop-color="#D8B4FE" stop-opacity="0.55"/>
    <stop offset="0.5" stop-color="#A855F7" stop-opacity="0.25"/>
    <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
</radialGradient>


<filter id="blur">
    <feGaussianBlur stdDeviation="35"/>
</filter>


<filter id="textGlow">
    <feGaussianBlur stdDeviation="5"/>
</filter>


</defs>



<rect width="1200" height="300" fill="url(#bg)"/>



<ellipse 
cx="180" 
cy="150"
rx="220"
ry="120"
fill="url(#purpleGlow)"
filter="url(#blur)">

<animate
attributeName="opacity"
values="0.3;0.8;0.3"
dur="4s"
repeatCount="indefinite"/>

</ellipse>



<ellipse 
cx="1030"
cy="140"
rx="230"
ry="140"
fill="url(#purpleGlow)"
filter="url(#blur)">

<animate
attributeName="opacity"
values="0.7;0.25;0.7"
dur="5s"
repeatCount="indefinite"/>

</ellipse>



<g fill="#C084FC">


<circle cx="130" cy="70" r="3">
<animate attributeName="opacity"
values="0.1;1;0.1"
dur="2s"
repeatCount="indefinite"/>
</circle>


<circle cx="250" cy="220" r="2">
<animate attributeName="cy"
values="220;160;220"
dur="4s"
repeatCount="indefinite"/>
</circle>


<circle cx="900" cy="80" r="3">
<animate attributeName="opacity"
values="1;0.2;1"
dur="3s"
repeatCount="indefinite"/>
</circle>


<circle cx="1080" cy="210" r="2">
<animate attributeName="cy"
values="210;130;210"
dur="5s"
repeatCount="indefinite"/>
</circle>


<circle cx="600" cy="40" r="2">
<animate attributeName="opacity"
values="0.2;1;0.2"
dur="3s"
repeatCount="indefinite"/>
</circle>


</g>




<path
d="M0 230 Q300 150 600 220 T1200 200"
stroke="#C084FC"
stroke-width="2"
opacity="0.25"
fill="none">


<animate
attributeName="stroke-opacity"
values="0.1;0.5;0.1"
dur="3s"
repeatCount="indefinite"/>

</path>



<path
d="M0 250 Q300 180 600 240 T1200 220"
stroke="#7C3AED"
stroke-width="1"
opacity="0.3"
fill="none"/>





<text
x="600"
y="140"
text-anchor="middle"
fill="#A855F7"
opacity="0.6"
font-size="58"
font-family="Segoe UI"
font-weight="700"
letter-spacing="12"
filter="url(#textGlow)">

GABRIELA LENZ

</text>



<text
x="600"
y="140"
text-anchor="middle"
fill="white"
font-size="58"
font-family="Segoe UI"
font-weight="700"
letter-spacing="12">

GABRIELA LENZ

</text>



<text
x="600"
y="190"
text-anchor="middle"
fill="#D8B4FE"
font-size="17"
font-family="monospace"
letter-spacing="5">

COMPUTER SCIENCE STUDENT

</text>



</svg>
