<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300">
    <stop stop-color="#05010D"/>
    <stop offset="0.5" stop-color="#1E0A3C"/>
    <stop offset="1" stop-color="#090015"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop stop-color="#C084FC" stop-opacity="0.8"/>
    <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
  </radialGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="25"/>
  </filter>

</defs>


<!-- Background -->
<rect width="1200" height="300" fill="url(#bg)"/>


<!-- Animated purple glow -->

<circle cx="250" cy="120" r="100" fill="url(#glow)" filter="url(#blur)">
  <animate 
    attributeName="cx"
    values="250;950;250"
    dur="8s"
    repeatCount="indefinite"/>
</circle>


<circle cx="900" cy="220" r="80" fill="url(#glow)" filter="url(#blur)">
  <animate 
    attributeName="cy"
    values="220;80;220"
    dur="6s"
    repeatCount="indefinite"/>
</circle>


<!-- Floating particles -->

<g fill="#C084FC">

<circle cx="150" cy="80" r="3">
  <animate attributeName="opacity"
  values="0.2;1;0.2"
  dur="3s"
  repeatCount="indefinite"/>
</circle>


<circle cx="1050" cy="100" r="4">
  <animate attributeName="opacity"
  values="1;0.2;1"
  dur="4s"
  repeatCount="indefinite"/>
</circle>


<circle cx="700" cy="50" r="2">
  <animate attributeName="cy"
  values="50;120;50"
  dur="5s"
  repeatCount="indefinite"/>
</circle>


</g>


<!-- Digital waves -->

<path 
d="M0 210 Q300 150 600 210 T1200 210"
stroke="#A855F7"
stroke-opacity="0.4"
stroke-width="2"
fill="none">

<animate 
attributeName="d"
dur="6s"
repeatCount="indefinite"
values="
M0 210 Q300 150 600 210 T1200 210;
M0 180 Q300 230 600 180 T1200 180;
M0 210 Q300 150 600 210 T1200 210
"/>

</path>


<!-- Glass effect -->

<rect x="120" y="70" width="960" height="160"
rx="30"
stroke="#C084FC"
stroke-opacity="0.15"
fill="none"/>


</svg>
