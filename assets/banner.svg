<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300">
    <stop stop-color="#05010D"/>
    <stop offset="0.5" stop-color="#17052F"/>
    <stop offset="1" stop-color="#080014"/>
</linearGradient>


<radialGradient id="softGlow">
    <stop stop-color="#C084FC" stop-opacity="0.25"/>
    <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
</radialGradient>


<filter id="blur">
    <feGaussianBlur stdDeviation="35"/>
</filter>


</defs>


<!-- Fundo -->

<rect width="1200" height="300" fill="url(#bg)"/>


<!-- Brilhos suaves -->

<ellipse 
cx="250" 
cy="150" 
rx="180" 
ry="120" 
fill="url(#softGlow)"
filter="url(#blur)">

<animate
attributeName="opacity"
values="0.4;0.8;0.4"
dur="5s"
repeatCount="indefinite"/>

</ellipse>



<ellipse 
cx="950" 
cy="120" 
rx="160" 
ry="100" 
fill="url(#softGlow)"
filter="url(#blur)">

<animate
attributeName="opacity"
values="0.8;0.3;0.8"
dur="6s"
repeatCount="indefinite"/>

</ellipse>



<!-- Partículas pequenas -->

<g fill="#C084FC">

<circle cx="160" cy="80" r="2">
<animate 
attributeName="opacity"
values="0.2;1;0.2"
dur="3s"
repeatCount="indefinite"/>
</circle>


<circle cx="1050" cy="190" r="3">
<animate 
attributeName="opacity"
values="1;0.2;1"
dur="4s"
repeatCount="indefinite"/>
</circle>


<circle cx="800" cy="60" r="2">
<animate 
attributeName="cy"
values="60;100;60"
dur="5s"
repeatCount="indefinite"/>
</circle>


</g>



<!-- Linha holográfica -->

<path
d="M200 220 Q600 170 1000 220"
stroke="#A855F7"
stroke-opacity="0.25"
stroke-width="1.5"
fill="none">

<animate
attributeName="stroke-opacity"
values="0.15;0.5;0.15"
dur="4s"
repeatCount="indefinite"/>

</path>



<!-- Nome -->

<text
x="600"
y="135"
text-anchor="middle"
fill="#FFFFFF"
font-size="55"
font-family="Segoe UI, sans-serif"
font-weight="700"
letter-spacing="12">

GABRIELA LENZ

</text>



<!-- Subtítulo -->

<text
x="600"
y="180"
text-anchor="middle"
fill="#C084FC"
font-size="18"
font-family="monospace"
letter-spacing="5">

COMPUTER SCIENCE STUDENT

</text>



</svg>
